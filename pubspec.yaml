name: lavka
publish_to: none
description: Офлайн трекер вязания «Лавка забытых историй» — вертикальный срез.
version: 0.2.2+6
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: 1.38.2
  sqflite: 2.4.6
  path: 1.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: 2.4.6
flutter:
  uses-material-design: true
  fonts:
  - family: Montserrat
    fonts:
    - asset: assets/fonts/Montserrat-400.ttf
      weight: 400
    - asset: assets/fonts/Montserrat-500.ttf
      weight: 500
    - asset: assets/fonts/Montserrat-600.ttf
      weight: 600
    - asset: assets/fonts/Montserrat-700.ttf
      weight: 700
  - family: Handjet
    fonts:
    - asset: assets/fonts/Handjet-500.ttf
      weight: 500
    - asset: assets/fonts/Handjet-600.ttf
      weight: 600
  assets:
  - assets/fonts/Montserrat-OFL.txt
  - assets/data/schema_v1.sql
  - assets/images/workshop_v2/
  - assets/images/icons/
  - assets/fonts/Handjet-OFL.txt
