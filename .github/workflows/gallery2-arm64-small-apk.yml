name: Gallery 2 - compact arm64 debug APK

on:
  push:
    branches:
      - feature/gallery2-active-project
    paths:
      - '.github/workflows/gallery2-arm64-small-apk.yml'

permissions:
  contents: read

jobs:
  compact-arm64-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Block cloud metadata access before any external action
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo iptables -w -I OUTPUT 1 -d 169.254.0.0/16 -j REJECT
          sudo iptables -w -I OUTPUT 1 -d 100.100.100.200/32 -j REJECT
          sudo ip6tables -w -I OUTPUT 1 -d fe80::/10 -j REJECT
          sudo ip6tables -w -I OUTPUT 1 -d fd00:ec2::254/128 -j REJECT
          sudo iptables -w -C OUTPUT -d 169.254.0.0/16 -j REJECT
          sudo iptables -w -C OUTPUT -d 100.100.100.200/32 -j REJECT
          sudo ip6tables -w -C OUTPUT -d fe80::/10 -j REJECT
          sudo ip6tables -w -C OUTPUT -d fd00:ec2::254/128 -j REJECT

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify unchanged Gallery2 images
        run: python3 -I tools/verify_gallery2_assets.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable

      - name: Recheck cloud metadata deny rules
        run: |
          set -euo pipefail
          sudo iptables -w -C OUTPUT -d 169.254.0.0/16 -j REJECT
          sudo iptables -w -C OUTPUT -d 100.100.100.200/32 -j REJECT
          sudo ip6tables -w -C OUTPUT -d fe80::/10 -j REJECT
          sudo ip6tables -w -C OUTPUT -d fd00:ec2::254/128 -j REJECT

      - name: Locked Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build standalone compact ARM64 APK (test app ID; debug certificate)
        env:
          ORG_GRADLE_PROJECT_lavkaPreview: 'true'
        run: flutter build apk --debug --split-per-abi --no-pub

      - name: Verify one compact ARM64 apk exists
        run: |
          set -euo pipefail
          file=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          test -s "$file"
          sha256sum "$file"
          ls -lh "$file"

      - name: Upload compact arm64 preview app
        uses: actions/upload-artifact@v4
        with:
          name: lavka-gallery2-arm64-compact-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 14
          if-no-files-found: error
