name: Gallery 2 - actual Lavka app validation

on:
  push:
    branches:
      - feature/gallery2-active-project
    paths:
      - '.github/workflows/gallery2-app-review.yml'
      - 'lib/**'
      - 'test/**'
      - 'assets/images/gallery2/**'
      - 'pubspec.yaml'
      - 'gallery2_manifest.json'
      - 'tools/verify_gallery2_assets.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery2-lavka-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Deny all metadata destinations before external actions
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo iptables -w -I OUTPUT 1 -d 169.254.0.0/16 -j REJECT
          sudo iptables -w -I OUTPUT 1 -d 100.100.100.200/32 -j REJECT
          sudo ip6tables -w -I OUTPUT 1 -d fe80::/10 -j REJECT
          sudo ip6tables -w -I OUTPUT 1 -d fd00:ec2::254/128 -j REJECT
          sudo iptables -w -C OUTPUT -d 169.254.0.0/16 -j REJECT
          sudo iptables -w -C OUTPUT -d 100.100.100.200/32 -j REJECT
          sudo ip6tables -w -C OUTPUT -d fe80::/10 -j REJECT
          sudo ip6tables -w -C OUTPUT -d fd00:ec2::254/128 -j REJECT
          echo "Network deny rules installed before checkout; no metadata endpoints contacted."

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm approved Gallery 2 asset checksums
        run: python3 -I tools/verify_gallery2_assets.py

      - name: Install pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable

      - name: Confirm network deny rules still present
        run: |
          set -euo pipefail
          sudo iptables -w -C OUTPUT -d 169.254.0.0/16 -j REJECT
          sudo iptables -w -C OUTPUT -d 100.100.100.200/32 -j REJECT
          sudo ip6tables -w -C OUTPUT -d fe80::/10 -j REJECT
          sudo ip6tables -w -C OUTPUT -d fd00:ec2::254/128 -j REJECT

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze entire app
        run: flutter analyze

      - name: Run all Flutter tests including existing SQLite compatibility
        run: flutter test --reporter expanded

      - name: Build isolated preview APK with separate package ID
        env:
          ORG_GRADLE_PROJECT_lavkaPreview: 'true'
        run: flutter build apk --debug --no-pub

      - name: Upload real app Gallery 2 Flutter renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery2-real-app-screenshots
          path: build/gallery2_app_renders/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installable preview APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lavka-gallery2-preview-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
